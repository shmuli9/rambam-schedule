<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 290" role="img" aria-label="One hour is 1080 chalakim; a lunar month is 29 days, 12 hours and 793 chalakim"><style>text{font-family:system-ui,sans-serif;fill:#223}.h{font-size:13px}.s{font-size:11px;fill:#556}.t{font-size:13px;font-weight:600}.he{font-size:14px}.w{fill:#fff;font-weight:600}.c{text-anchor:middle}</style>
<text x="16" y="22" class="t" >Time units · חלקים</text>
<rect x="30" y="40" width="460" height="44" rx="0" fill="#f3efe6" stroke="#445" stroke-width="2"/>
<text x="260" y="68" class="h c" >1 hour = 1080 chalakim (חלקים)</text>
<text x="30" y="106" class="s" >Chosen because 1080 divides evenly into halves, thirds, fourths,</text>
<text x="30" y="121" class="s" >sixths, eighths, ninths and tenths.</text>
<text x="16" y="156" class="t" >One lunar month (conjunction to conjunction) · חודש</text>
<rect x="30" y="170" width="270" height="56" rx="0" fill="#c8e6c9" stroke="#445" stroke-width="2"/>
<rect x="300" y="170" width="130" height="56" rx="0" fill="#bbdefb" stroke="#445" stroke-width="2"/>
<rect x="430" y="170" width="60" height="56" rx="0" fill="#ffe0b2" stroke="#445" stroke-width="2"/>
<text x="165" y="204" class="h c" >29 days</text>
<text x="365" y="204" class="h c" >12 hours</text>
<text x="460" y="204" class="h c" >793</text>
<text x="165" y="244" class="s c" >full days</text>
<text x="365" y="244" class="s c" >of the 30th day</text>
<text x="460" y="244" class="s c" >chalakim</text>
<text x="260" y="276" class="h c" >written 29 – 12 – 793</text>
</svg>
