<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 296" role="img" aria-label="Three categories of created things: changing matter and form, fixed form in matter, and form without matter"><style>text{font-family:system-ui,sans-serif;fill:#223}.h{font-size:13px}.s{font-size:11px;fill:#556}.t{font-size:13px;font-weight:600}.he{font-size:14px}.w{fill:#fff;font-weight:600}.c{text-anchor:middle}</style>
<text x="16" y="22" class="t" >Three kinds of created things · שלושה סוגים</text>
<rect x="24" y="38" width="472" height="72" rx="8" fill="#e3e8ef" stroke="#445" stroke-width="1.5"/>
<text x="40" y="62" class="t" >1. Matter + form, always changing</text>
<text x="40" y="83" class="h" >bodies of people and animals, plants, metals</text>
<text x="40" y="100" class="s" >coming into being and ceasing to be</text>
<rect x="24" y="122" width="472" height="72" rx="8" fill="#fff59d" stroke="#445" stroke-width="1.5"/>
<text x="40" y="146" class="t" >2. Matter + form, form fixed in its matter</text>
<text x="40" y="167" class="h" >the spheres and the stars in them</text>
<text x="40" y="184" class="s" >their matter and form are of a different kind</text>
<rect x="24" y="206" width="472" height="72" rx="8" fill="#e1bee7" stroke="#445" stroke-width="1.5"/>
<text x="40" y="230" class="t" >3. Form with no matter at all</text>
<text x="40" y="251" class="h" >the angels</text>
<text x="40" y="268" class="s" >no body, no physical being</text>
</svg>
