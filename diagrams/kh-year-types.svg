<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" role="img" aria-label="Years of lacking, ordinary and complete months, by the number of days between Rosh HaShanahs"><style>text{font-family:system-ui,sans-serif;fill:#223}.h{font-size:13px}.s{font-size:11px;fill:#556}.t{font-size:13px;font-weight:600}.he{font-size:14px}.w{fill:#fff;font-weight:600}.c{text-anchor:middle}</style>
