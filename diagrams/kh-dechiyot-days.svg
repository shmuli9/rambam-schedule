<path d="M392 112v14h68v-12" fill="none" stroke="#c62828" stroke-width="2"/><path d="M460 114l-5 -8m5 8l5 -8" stroke="#c62828" stroke-width="2"/>
<text x="22" y="158" class="h" >If the conjunction of Tishrei falls on one of these,</text>
<text x="22" y="176" class="h" >Rosh Chodesh Tishrei is the next day:</text>
<text x="22" y="200" class="h" >Sunday → Monday  ·  Wednesday → Thursday  ·  Friday → Sabbath</text>
</svg>
